name: Deploy na cyber_Folks (FTP)

# Każdy push na main wysyła stronę na serwer.
# Wymaga sekretów w repo (Settings → Secrets and variables → Actions):
#   FTP_SERVER    np. s123.cyber-folks.pl
#   FTP_USERNAME  login konta FTP
#   FTP_PASSWORD  hasło konta FTP
# Bez sekretów workflow się pomija, nic nie psuje.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: Wyślij pliki przez FTPS
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./domains/lumioagency.pl/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md

      - name: Brak sekretów FTP
        if: env.HAS_FTP != 'true'
        run: echo "Pominięto deploy – dodaj sekrety FTP_SERVER, FTP_USERNAME, FTP_PASSWORD."
